name: Syft SBOM & Trivy Security Pipeline

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        id: install_syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM for Repository with Syft
        id: generate_sbom
        run: |
          syft dir:. \
          --select-catalogers python \
          -o cyclonedx-json > repo-sbom.json

      # 2. Trivy futtatása a Syft SBOM-on (Action segítségével)
      - name: Scan Syft SBOM with Trivy
        id: trivy_scan
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          scan-type: 'sbom'
          scan-ref: 'repo-sbom.json'  # Ide adjuk át a Syft SBOM fájlt!
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # 3. SARIF eredmények feltöltése a GitHub Security fülre
      - name: Upload Trivy scan results to GitHub Security tab
        id: upload_sarif
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # 4. Az eredeti Syft SBOM lementése artifact-ként (maradhat, ha szükséged van rá)
      - name: Upload Syft SBOM as Artifact
        id: upload_sbom
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Syft-SBOM
          path: repo-sbom.json

      # 5. SBOM feltöltése Dependency-Track-re curl használatával
      - name: Upload SBOM to Dependency-Track via curl
        id: upload_dependencytrack
        continue-on-error: true
        run: |
          curl -v -X "POST" "${{ secrets.DEPENDENCYTRACK_URL }}" \
               -H 'Content-Type: multipart/form-data' \
               -H "X-Api-Key: ${{ secrets.DEPENDENCYTRACK_APIKEY }}" \
               -F "project= ${{ secrets.DEPENDENCYTRACK_PROJECT }}" \
               -F "bom=@repo-sbom.json"

      # Trivy megbukott - job failure
      - name: Check Trivy status and fail job if vulnerabilities found
        id: check_trivy
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "::error::Trivy talált HIGH vagy CRITICAL sérülékenységet!"
          exit 1